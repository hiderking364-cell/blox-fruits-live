<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits Live | Values</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚔️ Blox Fruits Live</h1>
        <p>Live Trade Values & Perm Prices</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="values.html" class="active">Values</a>
        <a href="stock.html">Stock</a>
        <a href="ai.html">Live AI</a>
    </nav>

    <main>
        <section>
            <h2>Live Values</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Data updates automatically. Physical value shown first, Permanent value highlighted in gold.</p>
            
            <div class="tabs">
                <button id="tab-fruits" class="active" onclick="loadValues('fruits')">Fruits</button>
                <button id="tab-limiteds" onclick="loadValues('limiteds')">Limiteds</button>
                <button id="tab-gamepasses" onclick="loadValues('gamepasses')">Gamepasses</button>
            </div>

            <div id="values-list" class="values-grid">
                <div class="loading">Loading live values...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Blox Fruits Live. Data provided by BloxFruitsValues.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Load fruits by default when page loads
        document.addEventListener('DOMContentLoaded', () => loadValues('fruits'));
    </script>
</body>
</html>

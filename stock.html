<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits Live | Stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚔️ Blox Fruits Live</h1>
        <p>Live Dealer Stock</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="values.html">Values</a>
        <a href="stock.html" class="active">Stock</a>
        <a href="ai.html">Live AI</a>
    </nav>

    <main>
        <section>
            <h2>Current Stock</h2>
            <div class="tabs">
                <button id="tab-normal" class="active" onclick="showStock('normal')">Normal Dealer</button>
                <button id="tab-mirage" onclick="showStock('mirage')">Mirage Dealer</button>
            </div>
            <div id="stock-list" class="values-grid">
                <div class="loading">Fetching live stock...</div>
            </div>
            <p id="stock-timer"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Blox Fruits Live. Data provided by FruityBlox.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => loadStock());
    </script>
</body>
</html>
